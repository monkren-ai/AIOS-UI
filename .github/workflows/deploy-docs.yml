name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nothing-design-skill/nothing-design/web-ui-kit/react/package-lock.json

      - name: Install dependencies
        working-directory: nothing-design-skill/nothing-design/web-ui-kit/react
        run: npm ci

      - name: Build showcase
        working-directory: nothing-design-skill/nothing-design/web-ui-kit/react
        env:
          NODE_ENV: production
        run: npm run build:showcase

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nothing-design-skill/nothing-design/web-ui-kit/react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
